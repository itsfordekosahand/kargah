function loadState(){
  try{const r = JSON.parse(localStorage.getItem(LS_KEY)); if(r && r.settings && r.categories) return r;}catch(e){}
  const em=document.getElementById('embdata'); /* فایل HTML ذخیره‌شده با داده */
  if(em){ try{ const r=JSON.parse(em.textContent); if(r && r.settings && r.categories) return r; }catch(e){} }
  return JSON.parse(JSON.stringify(DEMO)); /* اولین باز شدن: مثال آماده */
}
let S = loadState();
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){ toast('ذخیره انجام نشد: '+e.message); } }
const uid = () => Math.random().toString(36).slice(2,9);

function esc(x){ return String(x==null?'':x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function nf(n,d){ d = (d==null?2:d); if(typeof n!=='number'||!isFinite(n)) return '—'; const m=Math.pow(10,d); const r=Math.round(n*m)/m; return r.toLocaleString('fa-IR',{maximumFractionDigits:d}); }
function raw(n){ if(typeof n!=='number'||!isFinite(n)) return ''; return String(Math.round(n*100)/100); }
function numify(s){ return String(s==null?'':s)
  .replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
  .replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d))
  .replace(/٫/g,'.').replace(/٬/g,''); }
function num(s){ const v=parseFloat(numify(s)); return isNaN(v)?0:v; }
function nowStr(){ try{ return new Date().toLocaleString('fa-IR'); }catch(e){ return new Date().toISOString().slice(0,16); } }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),2200); }

/* ============================= موتور فرمول ============================= */
function tokenize(src, isName){
  const t=[]; let i=0;
  const isWordCh=c=>/[A-Za-z0-9\u0600-\u06FF_]/.test(c||'');
  function scanWord(from){ // اسکن یک کلمه (با نقطه‌ی داخلی مثل W_door)
    let j=from+1;
    while(j<src.length){
      if(isWordCh(src[j])){ j++; continue; }
      if(src[j]==='.' && isWordCh(src[j+1])){ j++; continue; }
      break;
    }
    return j;
  }
  while(i<src.length){
    const c=src[i];
    if(/\s/.test(c)){ i++; continue; }
    if(/[0-9]/.test(c) || (c==='.' && /[0-9]/.test(src[i+1]||''))){
      let j=i; while(j<src.length && /[0-9.]/.test(src[j])) j++;
      t.push({t:'num',v:parseFloat(src.slice(i,j))}); i=j; continue;
    }
    if(/[A-Za-z\u0600-\u06FF_]/.test(c)){
      // کلمه‌ی اول + کلمه‌هایی که با فاصله بهش چسبیدن (اسم چندکلمه‌ای مثل «عرض داخلی»)
      const words=[], ends=[];
      let e=scanWord(i); words.push(src.slice(i,e)); ends.push(e);
      let k=e;
      while(k<src.length && /\s/.test(src[k])){
        let m=k; while(m<src.length && /\s/.test(src[m])) m++;
        if(!isWordCh(src[m])) break;
        const wEnd=scanWord(m);
        words.push(src.slice(m,wEnd)); ends.push(wEnd);
        k=wEnd;
      }
      let chosen=0;
      if(isName){
        for(let w=words.length; w>=1; w--){ if(isName(words.slice(0,w).join(' '))){ chosen=w; break; } }
      }
      if(chosen===0) chosen=1; // اگه اسم چندکلمه‌ای شناخته نشد، همون کلمه‌ی اول رو بده تا خطای واضح بده
      t.push({t:'id',v:words.slice(0,chosen).join(' ')});
      i=ends[chosen-1];
      continue;
    }
    if('+-*/(),'.indexOf(c)>=0){ t.push({t:c}); i++; continue; }
    throw new Error('کاراکتر نامعتبر: '+c);
  }
  return t;
}
function callFn(name,args){
  const f=String(name).toLowerCase();
  if(f==='floor') return Math.floor(args[0]);
  if(f==='ceil')  return Math.ceil(args[0]);
  if(f==='round') return Math.round(args[0]);
  if(f==='abs')   return Math.abs(args[0]);
  if(f==='min')   return Math.min.apply(null,args);
  if(f==='max')   return Math.max.apply(null,args);
  throw new Error('تابع ناشناخته: '+name);
}
function uF(){ const u=(typeof S!=='undefined'&&S.settings&&S.settings.unit)||'mm'; return u==='cm'?10:(u==='m'?1000:1); }
function uName(){ const u=(typeof S!=='undefined'&&S.settings&&S.settings.unit)||'mm'; return u==='cm'?'سانتی‌متر':(u==='m'?'متر':'میلی‌متر'); }
function uPh(){ const u=(typeof S!=='undefined'&&S.settings&&S.settings.unit)||'mm'; return u==='cm'?'(سانتی‌متر)':(u==='m'?'(متر)':'(مم)'); }
function uFi(i){ const u=i&&i.u; if(u==='n'||u==='mm') return 1; if(u==='cm') return 10; if(u==='m') return 1000; return uF(); }
function toU(mm,f){ if(mm==null||String(mm).trim()==='') return ''; const n=num(mm); if(!isFinite(n)) return String(mm); const k=(f===undefined?uF():f); return String(Math.round(n/k*1000)/1000); }
function toMM(x,f){ if(x==null||String(x).trim()==='') return ''; const n=num(x); if(!isFinite(n)) return String(x); const k=(f===undefined?uF():f); return String(Math.round(n*k*100)/100); }
function ufn(mm,i){ const s=toU(mm,(i===undefined?undefined:uFi(i))); if(s==='') return ''; const d=(String(s).split('.')[1]||'').length; return nf(num(s),d); }
function normOp(s){ return String(s==null?'':s)
  .replace(/[×✕⋅∙]/g,'*')
  .replace(/[÷]/g,'/')
  .replace(/[−–—]/g,'-')
  .replace(/[،؛]/g,',')
  .replace(/٪/g,'%'); }
function parseEval(src, resolve, isName){
  const ts=tokenize(normOp(numify(String(src))), isName); let p=0;
  function peek(){ return ts[p]; }
  function next(){ return ts[p++]; }
  function expr(){
    let v=term();
    while(peek() && (peek().t==='+'||peek().t==='-')){ const op=next().t; const r=term(); v = op==='+' ? v+r : v-r; }
    return v;
  }
  function term(){
    let v=unary();
    while(peek() && (peek().t==='*'||peek().t==='/')){ const op=next().t; const r=unary(); v = op==='*' ? v*r : v/r; }
    return v;
  }
  function unary(){ if(peek() && peek().t==='-'){ next(); return -unary(); } return primary(); }
  function primary(){
    const tk=next();
    if(!tk) throw new Error('فرمول ناقص است');
    if(tk.t==='num') return tk.v;
    if(tk.t==='('){ const v=expr(); const c=next(); if(!c||c.t!==')') throw new Error('پرانتز بسته نشده'); return v; }
    if(tk.t==='id'){
      if(peek() && peek().t==='('){
        next();
        const args=[];
        if(peek() && peek().t!==')'){
          args.push(expr());
          while(peek() && peek().t===','){ next(); args.push(expr()); }
        }
        const c=next(); if(!c||c.t!==')') throw new Error('پرانتز بسته نشده');
        return callFn(tk.v,args);
      }
      const v=resolve(tk.v);
      if(typeof v!=='number' || !isFinite(v)) throw new Error('مقدار نامعتبر برای «'+tk.v+'»');
      return v;
    }
    throw new Error('فرمول نامعتبر است');
  }
  const out=expr();
  if(p<ts.length) throw new Error('فرمول اضافه دارد');
  if(typeof out!=='number' || !isFinite(out)) throw new Error('نتیجه نامعتبر است');
  return out;
}

/* ============================= محاسبه یک مدل ============================= */
const EDGES=[['u','بالا'],['d','پایین'],['l','چپ'],['r','راست']];

function dupLabels(m){
  const seen={}, dups=[];
  const push=n=>{ n=String(n||'').trim(); if(!n) return; if(seen[n]) dups.push(n); seen[n]=1; };
  (m.inputs||[]).forEach(x=>push(x.label));
  (m.vars||[]).forEach(x=>push(x.label));
  (m.pieces||[]).forEach(x=>push(x.label));
  (m.hw||[]).forEach(x=>push(x.label));
  return dups;
}

function buildCtx(model, freeVals){
  const scope=Object.create(null), recipes=new Map(), busy=new Set(), errors=[];
  (model.inputs||[]).forEach(i=>{
    if(i.mode==='const') scope[i.label]=num(i.value);
    else if(i.mode==='free'){
      const rawv = (freeVals && freeVals[i.id]!==undefined && String(freeVals[i.id]).trim()!=='') ? freeVals[i.id] : i.value;
      scope[i.label]=num(rawv);
    }
  });
  (model.inputs||[]).filter(i=>i.mode==='formula').forEach(i=>recipes.set(i.label,()=>ev(i.formula,'ورودی «'+i.label+'»')));
  (model.vars||[]).forEach(v=>recipes.set(v.label,()=>ev(v.formula,'متغیر «'+v.label+'»')));
  (model.pieces||[]).forEach(p=>{
    recipes.set(p.label+'.تعداد',()=>ev(p.countF,'تعداد «'+p.label+'»'));
    recipes.set(p.label+'.طول',   ()=>ev(p.lenF,  'طول «'+p.label+'»'));
    recipes.set(p.label+'.عرض',   ()=>ev(p.widF,  'عرض «'+p.label+'»'));
  });
  (model.hw||[]).forEach(h=>recipes.set(h.label+'.تعداد',()=>ev(h.formula,'یراق «'+h.label+'»')));

  function resolve(name){
    if(Object.prototype.hasOwnProperty.call(scope,name)) return scope[name];
    if(recipes.has(name)){
      if(busy.has(name)) throw new Error('حلقه در فرمول: «'+name+'»');
      busy.add(name);
      try{
        const v=recipes.get(name)();
        if(typeof v!=='number'||!isFinite(v)) throw new Error('مقدار نامعتبر: «'+name+'»');
        scope[name]=v; return v;
      } finally { busy.delete(name); }
    }
    throw new Error('نام ناشناخته «'+name+'»');
  }
  function isName(n){ return Object.prototype.hasOwnProperty.call(scope,n) || recipes.has(n); }
  function ev(src,where){
    if(src===undefined||src===null||String(src).trim()==='') throw new Error('فرمول خالی'+(where?' ('+where+')':''));
    try{ return parseEval(src,resolve,isName); }
    catch(e){ throw new Error((where?where+': ':'')+e.message); }
  }
  // اجرای فرمول با نام‌های محلی (مثلاً تعداد = تعداد همین قطعه)
  function run(locals,fn){
    const saved={};
    Object.keys(locals).forEach(k=>{
      saved[k]={had:Object.prototype.hasOwnProperty.call(scope,k),v:scope[k]};
      scope[k]=locals[k];
    });
    try{ return fn(); }
    finally{
      Object.keys(saved).forEach(k=>{ if(saved[k].had) scope[k]=saved[k].v; else delete scope[k]; });
    }
  }
  return {resolve,ev,run,errors};
}

function calculate(model, freeVals){
  const st=S.settings;
  const out={rows:[],mats:[],groove:{lines:0,m:0},pvc:{m:0},hw:[],computed:[],errors:[]};
  const dups=dupLabels(model);
  if(dups.length) out.errors.push('نام تکراری: '+[...new Set(dups)].join('، '));

  let ctx;
  try{ ctx=buildCtx(model,freeVals); }
  catch(e){ out.errors.push(e.message); return out; }

  // نمایش مقادیر محاسبه‌شده (ورودی‌های فرمولی + متغیرها)
  (model.inputs||[]).filter(i=>i.mode==='formula').forEach(i=>{
    try{ out.computed.push([i.label, ctx.resolve(i.label)]); }catch(e){ out.errors.push(e.message); }
  });
  (model.vars||[]).forEach(v=>{
    try{ out.computed.push([v.label, ctx.resolve(v.label)]); }catch(e){ out.errors.push(e.message); }
  });

  const matMap={};
  const hwMap={};
  (model.pieces||[]).forEach(p=>{
    const nm=String(p.label||'').trim();
    if(!nm){ out.errors.push('قطعه‌ای بدون نام داری؛ اول اسمش رو بذار.'); return; }
    let cnt,len,wid;
    try{
      cnt=ctx.resolve(nm+'.تعداد');
      len=ctx.resolve(nm+'.طول');
      wid=ctx.resolve(nm+'.عرض');
    }catch(e){ out.errors.push(e.message); return; }
    const g=p.groove||{on:false,edges:{}}, pv=p.pvc||{on:false,edges:{}};
    const gOn=!!g.on, pOn=!!pv.on;
    const gSides=EDGES.filter(([k])=>gOn && g.edges && g.edges[k]);
    const pSides=EDGES.filter(([k])=>pOn && pv.edges && pv.edges[k]);
    // شیار
    let gLines=0,gLen=0;
    gSides.forEach(([k])=>{
      gLines += cnt;
      gLen += ((k==='u'||k==='d') ? len : wid) * cnt / 1000;
    });
    // PVC
    let pLen=0;
    pSides.forEach(([k])=>{ pLen += ((k==='u'||k==='d') ? len : wid) * cnt / 1000; });

    out.groove.lines += gLines;
    out.groove.m += gLen;
    out.pvc.m += pLen;

    const material=String(p.material||'').trim()||'بدون جنس';
    const thk=String(p.thk||'').trim();
    const area=len*wid*cnt/1e6;
    const key=material+'|'+thk;
    if(!matMap[key]) matMap[key]={name:material,thk:thk,area:0};
    matMap[key].area += area;

    // یراق‌های مرتبط با همین قطعه (تعداد/طول/عرض = مقدار همین قطعه)
    if((p.hw||[]).length){
      ctx.run({'تعداد':cnt,'طول':len,'عرض':wid},()=>{
        (p.hw||[]).forEach(h=>{
          const hn=String(h.label||'').trim();
          if(!hn){ out.errors.push('یراق بدون نام در قطعه «'+nm+'»'); return; }
          try{ const c=ctx.ev(h.formula,'یراق «'+hn+'» قطعه «'+nm+'»'); hwMap[hn]=(hwMap[hn]||0)+c; }
          catch(e){ out.errors.push(e.message); }
        });
      });
    }

    out.rows.push({
      piece:nm, material:material, thk:thk, cnt:cnt, len:len, wid:wid,
      gdesc: gSides.length ? (gSides.map(x=>x[1]).join('، ')+' (عمق '+nf(num(g.depth),0)+')') : '',
      pdesc: pSides.length ? (pSides.map(x=>x[1]).join('، ')+' ('+nf(num(pv.thk),0)+' مم)') : '',
      gEdges: Object.fromEntries(EDGES.map(([k])=>[k, gOn && !!(g.edges&&g.edges[k])])),
      pEdges: Object.fromEntries(EDGES.map(([k])=>[k, pOn && !!(pv.edges&&pv.edges[k])])),
      area:area
    });
  });

  const sheetArea=(st.sheetL*st.sheetW)/1e6;
  out.mats=Object.values(matMap).map(x=>{
    const withWaste=x.area*(1+(st.waste||0)/100);
    return {name:x.name,thk:x.thk,area:x.area,sheets: sheetArea>0?Math.ceil(withWaste/sheetArea):0};
  }).sort((a,b)=>b.area-a.area);

  // یراق‌های سطح مدل (مستقل از قطعه)
  (model.hw||[]).forEach(h=>{
    const nm=String(h.label||'').trim();
    if(!nm){ out.errors.push('یراقی بدون نام داری.'); return; }
    try{ const c=ctx.resolve(nm+'.تعداد'); hwMap[nm]=(hwMap[nm]||0)+c; }
    catch(e){ out.errors.push(e.message); }
  });
  out.hw=Object.keys(hwMap).map(k=>({name:k,cnt:hwMap[k]}));
  return out;
}

function uniqLabel(m,base){
  const used={};
  (m.inputs||[]).concat(m.vars||[],m.pieces||[],m.hw||[]).forEach(x=>{ used[String(x.label||'').trim()]=1; });
  let n=base, i=1;
  while(used[n]){ i++; n=base+' '+i; }
  return n;
}
function nameTokens(m){
  const out=[];
  (m.inputs||[]).forEach(i=>{const n=String(i.label||'').trim(); if(n && out.indexOf(n)<0) out.push(n);});
  (m.vars||[]).forEach(v=>{const n=String(v.label||'').trim(); if(n && out.indexOf(n)<0) out.push(n);});
  return out;
}
function tokChips(m,extras){
  let toks=(extras||[]).slice();
  nameTokens(m).forEach(n=>{ if(toks.indexOf(n)<0) toks.push(n); });
  if(!toks.length) return '';
  return '<div class="toks"><span class="tklbl">کلیک = درج نام (بدون غلط تایپی):</span>'+
    toks.map(t=>'<button type="button" class="tok" onmousedown="event.preventDefault()" onclick="App.insTok(\''+esc(t)+'\')">'+esc(t)+'</button>').join('')+
    '</div>';
}

function helpBox(m){
  const names=[]
    .concat((m.inputs||[]).map(x=>x.label))
    .concat((m.vars||[]).map(x=>x.label))
    .concat((m.pieces||[]).flatMap(p=>[p.label+'.تعداد',p.label+'.طول',p.label+'.عرض']))
    .concat((m.hw||[]).map(x=>x.label+'.تعداد'))
    .filter(x=>String(x||'').trim());
  return '<div class="help"><b>نام‌های قابل استفاده در فرمول:</b> '+
    (names.length?names.map(n=>'<code>'+esc(n)+'</code>').join(' '):'<span class="emptymini">هنوز چیزی تعریف نشده</span>')+
    '<br>داخل بخش «یراق این قطعه» نام‌های <code>تعداد</code> و <code>طول</code> و <code>عرض</code> مقدار همان قطعه رو می‌دن.'+
    '<br>توابع: <code>floor</code> <code>ceil</code> <code>round</code> <code>min</code> <code>max</code> <code>abs</code> — عملگرها: <code>+</code> <code>-</code> <code>*</code> <code>/</code> <code>( )</code>'+
    '<br>مثال: <code>طول - 2 * ضخامت</code> &nbsp; یا &nbsp; <code>کف.عرض / در.تعداد</code></div>';
}

function viewCalc(){
  if(!V.calcModelId){
    let h='<div class="head"><div><h2>محاسبه تک‌کابینت</h2><div class="hint">مدل رو انتخاب کن، فقط بُعد آزاد رو وارد کن، خروجی فوری بگیر.</div></div></div>';
    if(!S.categories.length) return h+empty('اول بریم سراغ «قالب‌ها» و یک دسته و مدل بسازیم.');
    const cats=S.categories;
    const cur=V.pickCat && cats.some(c=>c.id===V.pickCat) ? V.pickCat : (cats[0]?cats[0].id:null);
    V.pickCat=cur;
    h+='<div class="tabs">'+cats.map(c=>'<button class="'+(c.id===cur?'on':'')+'" onclick="App.pickCat(\''+c.id+'\')">'+esc(c.name)+'</button>').join('')+'</div>';
    const list=S.models.filter(m=>m.catId===cur);
    if(!list.length) return h+empty('این دسته هنوز مدلی نداره.');
    h+='<div class="grid">'+list.map(m=>
      '<div class="card"><div class="t">'+esc(m.name)+'</div>'+
      '<div class="s">'+nf((m.inputs||[]).filter(i=>i.mode==='free').length,0)+' ورودی آزاد</div>'+
      '<div class="acts"><button class="btn" onclick="App.calcPick(\''+m.id+'\')">انتخاب</button></div></div>').join('')+'</div>';
    return h;
  }
  const m=S.models.find(x=>x.id===V.calcModelId);
  if(!m){ V.calcModelId=null; return viewCalc(); }
  const frees=(m.inputs||[]).filter(i=>i.mode==='free');
  const consts=(m.inputs||[]).filter(i=>i.mode==='const');
  let h='<div class="head"><div><button class="btn2" onclick="App.calcBack()">→ مدل دیگر</button> '+
     '<h2 style="display:inline-block;margin:0 8px">'+esc(m.name)+'</h2></div>'+
     '<button class="btn" onclick="App.runCalc()">🧮 محاسبه</button></div>';
  if(frees.length){
    h+='<div class="card"><h4>ابعاد سفارش</h4>';
    frees.forEach(i=>{
      const cur=(V.calcFree[i.id]!==undefined && String(V.calcFree[i.id]).trim()!=='') ? V.calcFree[i.id] : toU(i.value,uFi(i));
      h+='<div class="row"><label class="lbl">'+esc(i.label||'ورودی')+'</label>'+
         '<input class="val" inputmode="decimal" value="'+esc(cur)+'" oninput="App.setFree(\''+i.id+'\',this.value)"></div>';
    });
    h+='</div>';
  }
  if(consts.length){
    h+='<div class="card"><h4>ثابت‌های این مدل</h4><div class="chips">'+
      consts.map(i=>'<span class="chip">'+esc(i.label)+' = <b>'+ufn(i.value,i)+'</b> '+uName()+'</span>').join('')+'</div></div>';
  }
  if(!frees.length && !consts.length){
    h+='<div class="card">'+empty('این مدل هنوز ورودی‌ای نداره. از «قالب‌ها» واردش کن و ورودی تعریف کن.')+'</div>';
  }
  if(V.calcRes) h+=resultHTML(V.calcRes,m.name);
  return h;
}
function pvHTML(g,p){
  let h='<div class="pv">';
  EDGES.forEach(([k])=>{
    if(p[k]) h+='<span class="e pvc '+k+'"></span>';
    if(g[k]) h+='<span class="e grv '+k+'"></span>';
  });
  h+='<span class="core"></span></div>';

function consumptionCards(g,p,hw){
  let h='<div class="sumcards">';

  h+='<div class="sumcard"><div class="k">متر طول شیار</div><div class="v">'+nf(g.m)+' متر</div></div>';
  h+='<div class="sumcard"><div class="k">متر طول PVC</div><div class="v">'+nf(p.m)+' متر</div></div>';
  hw.forEach(x=>h+='<div class="sumcard"><div class="k">'+esc(x.name)+'</div><div class="v">'+nf(x.cnt,0)+'</div></div>');

}
function resultHTML(res,title){
  let h='';
  if(res.errors && res.errors.length) h+='<div class="err">'+res.errors.map(e=>'• '+esc(e)).join('<br>')+'</div>';
  if(res.computed && res.computed.length){
    h+='<div class="card"><h4>مقادیر محاسبه‌شده</h4><div class="chips">'+
      res.computed.map(c=>'<span class="chip">'+esc(c[0])+' = <b>'+nf(c[1])+'</b></span>').join('')+'</div></div>';
  }
  h+='<div class="card"><h4>لیست برش</h4>';
  if(res.rows.length){
    h+='<div class="tw"><table><tr><th>پیش‌نمایش</th><th>نام قطعه</th><th>جنس</th><th>ضخامت</th><th>تعداد</th><th>طول</th><th>عرض</th><th>شیار</th><th>PVC</th></tr>';
    res.rows.forEach(r=>{
      h+='<tr><td style="text-align:center">'+pvHTML(r.gEdges,r.pEdges)+'</td>'+
        '<td class="wrap"><b>'+esc(r.piece)+'</b></td><td class="wrap">'+esc(r.material)+'</td><td>'+esc(r.thk||'—')+'</td>'+
        '<td>'+nf(r.cnt,0)+'</td><td>'+nf(r.len,0)+'</td><td>'+nf(r.wid,0)+'</td>'+
        '<td class="wrap">'+esc(r.gdesc||'—')+'</td><td class="wrap">'+esc(r.pdesc||'—')+'</td></tr>';
    });
    h+='</table></div>';
    h+='<div class="legend" style="margin-top:8px"><span><i style="background:#2563eb"></i>شیار</span><span><i style="background:#f59e0b"></i>PVC</span></div>';
  }else h+='<div class="emptymini">قطعه‌ای محاسبه نشد.</div>';
  h+='</div>';

  h+='<div class="card"><h4>جمع‌بندی متریال</h4>';
  if(res.mats.length){
    h+='<div class="tw"><table><tr><th>جنس</th><th>ضخامت</th><th>مترمربع</th><th>تعداد ورق (با پرت '+nf(S.settings.waste,0)+'٪)</th></tr>';
    res.mats.forEach(x=>h+='<tr><td class="wrap">'+esc(x.name)+'</td><td>'+esc(x.thk||'—')+'</td><td>'+nf(x.area)+'</td><td><b>'+nf(x.sheets,0)+'</b></td></tr>');
    const _ta=res.mats.reduce((s,x)=>s+x.area,0), _ts=res.mats.reduce((s,x)=>s+x.sheets,0);
    h+='<tr><td class="wrap"><b>جمع کل</b></td><td></td><td><b>'+nf(_ta)+'</b></td><td><b>'+nf(_ts,0)+'</b></td></tr>';
    h+='</table></div>';
    h+='<div class="hint">ابعاد ورق: '+ufn(S.settings.sheetL)+' × '+ufn(S.settings.sheetW)+' '+uName()+' (از تنظیمات قابل تغییر)</div>';
  }else h+='<div class="emptymini">متریالی ثبت نشد.</div>';
  h+='</div>';

  h+='<div class="card"><h4>جمع‌بندی شیار، PVC و یراق</h4>'+consumptionCards(res.groove,res.pvc,res.hw)+'</div>';

  h+='<div class="row"><button class="btn g" onclick="App.print(\'single\')">🖨 چاپ / PDF</button>'+
     '<button class="btn2" onclick="App.expXLS(\'single\')">⬇ خروجی Excel</button>'+
     '<button class="btn2" onclick="App.expCSV(\'single\')">⬇ خروجی CSV</button></div>';
  if(title) h+='<div class="hint">'+esc(title)+' — '+esc(nowStr())+'</div>';
  return h;
}

function numv(v){ const s=String(v==null?'':v).trim(); if(s==='') return 0; const n=parseFloat(numify(s)); return isNaN(n)?0:n; }
function invoiceData(pr){
  const agg=aggregate(pr);
  const inv=pr.inv||{mats:{},hw:{},groove:'',pvc:''};
  let matT=0, hwT=0;
  const mats=agg.mats.map(x=>{
    const key=x.name+'|'+x.thk;
    const pv=(inv.mats&&inv.mats[key])||{};
    const line=x.sheets*numv(pv.sheet)+x.area*numv(pv.area);
    matT+=line;
    return {key:key,name:x.name,thk:x.thk,area:x.area,sheets:x.sheets,
      sp:pv.sheet==null?'':String(pv.sheet),ap:pv.area==null?'':String(pv.area),line:line};
  });
  const hw=agg.hw.map(x=>{
    const p=(inv.hw&&inv.hw[x.name]!=null)?inv.hw[x.name]:'';
    const line=x.cnt*numv(p); hwT+=line;
    return {name:x.name,cnt:x.cnt,price:String(p==null?'':p),line:line};
  });
  const gro={m:agg.groove.m,price:String(inv.groove==null?'':inv.groove),line:agg.groove.m*numv(inv.groove)};
  const pvc={m:agg.pvc.m,price:String(inv.pvc==null?'':inv.pvc),line:agg.pvc.m*numv(inv.pvc)};
  const svcT=gro.line+pvc.line;
  return {agg:agg,mats:mats,hw:hw,gro:gro,pvc:pvc,matT:matT,hwT:hwT,svcT:svcT,
    total:matT+hwT+svcT,errors:agg.errors};
}

    r:d.mats.map(x=>[x.name,x.thk||'',fmt(x.area),fmt(x.sheets),x.sp||'',x.ap||'',fmt(x.line)])});

function consumptionRows(g,p,hw,fmt){
  fmt=fmt||raw;
  const r=[['خطوط شیار',fmt(g.lines)],['متر طول شیار',fmt(g.g!==undefined?g.g:g.m)],['متر طول PVC',fmt(p.m)]];
  hw.forEach(x=>r.push([x.name,fmt(x.cnt)]));
  return r;
}
function sectionsSingle(res,fmt){
  fmt=fmt||raw;
  const s=[];
  s.push({t:'لیست برش',h:['نام قطعه','جنس','ضخامت','تعداد','طول (مم)','عرض (مم)','شیار','PVC'],
    r:res.rows.map(r=>[r.piece,r.material,r.thk||'',fmt(r.cnt),fmt(r.len),fmt(r.wid),r.gdesc||'—',r.pdesc||'—'])});
  s.push({t:'جمع‌بندی متریال',h:['جنس','ضخامت','مترمربع','تعداد ورق'],
    r:res.mats.map(x=>[x.name,x.thk||'',fmt(x.area),fmt(x.sheets)]).concat(
      res.mats.length?[['جمع کل','',fmt(res.mats.reduce((a,x)=>a+x.area,0)),fmt(res.mats.reduce((a,x)=>a+x.sheets,0))]]:[])});
  s.push({t:'جمع‌بندی شیار، PVC و یراق',h:['مورد','مقدار'],r:consumptionRows(res.groove,res.pvc,res.hw,fmt)});
  if(res.errors && res.errors.length) s.push({t:'خطاها',h:['پیام'],r:res.errors.map(e=>[e])});
  return s;
}
function aggregate(pr){
  const cut=[], mats={}, hw={};
  let gl=0,gm=0,pm=0; const errors=[];
  pr.items.forEach(it=>{
    const m=S.models.find(x=>x.id===it.modelId);
    if(!m){ errors.push('یکی از کابینت‌ها به مدل حذف‌شده وصله.'); return; }
    const cab=m.name+(freeSummary(m,it.values)?' ('+freeSummary(m,it.values)+')':'');
    let res;
    try{ res=calculate(m,it.values); }
    catch(e){ errors.push(cab+': '+e.message); return; }
    (res.errors||[]).forEach(e=>errors.push(cab+': '+e));
    res.rows.forEach(r=>{ cut.push(Object.assign({},r,{cab:cab})); });
    res.mats.forEach(x=>{ const k=x.name+'|'+x.thk; if(!mats[k]) mats[k]={name:x.name,thk:x.thk,area:0}; mats[k].area+=x.area; });
    gl+=res.groove.lines; gm+=res.groove.m; pm+=res.pvc.m;
    res.hw.forEach(x=>{ hw[x.name]=(hw[x.name]||0)+x.cnt; });
  });
  const st=S.settings, sheetArea=(st.sheetL*st.sheetW)/1e6;
  const matRows=Object.keys(mats).map(k=>{
    const x=mats[k];
    return {name:x.name,thk:x.thk,area:x.area,sheets: sheetArea>0?Math.ceil(x.area*(1+(st.waste||0)/100)/sheetArea):0};
  }).sort((a,b)=>b.area-a.area);
  return {cut:cut,mats:matRows,groove:{lines:gl,m:gm},pvc:{m:pm},
    hw:Object.keys(hw).map(k=>({name:k,cnt:hw[k]})),errors:[...new Set(errors)]};
}
function sectionsAggregate(agg,fmt){
  fmt=fmt||raw;
  const s=[];
  s.push({t:'لیست برش کل پروژه',h:['کابینت','نام قطعه','جنس','ضخامت','تعداد','طول','عرض','شیار','PVC'],
    r:agg.cut.map(r=>[r.cab,r.piece,r.material,r.thk||'',fmt(r.cnt),fmt(r.len),fmt(r.wid),r.gdesc||'—',r.pdesc||'—'])});
  s.push({t:'جمع‌بندی متریال',h:['جنس','ضخامت','مترمربع','تعداد ورق'],
    r:agg.mats.map(x=>[x.name,x.thk||'',fmt(x.area),fmt(x.sheets)]).concat(
      agg.mats.length?[['جمع کل','',fmt(agg.mats.reduce((a,x)=>a+x.area,0)),fmt(agg.mats.reduce((a,x)=>a+x.sheets,0))]]:[])});
  s.push({t:'جمع‌بندی شیار، PVC و یراق',h:['مورد','مقدار'],r:consumptionRows(agg.groove,agg.pvc,agg.hw,fmt)});
  if(agg.errors.length) s.push({t:'خطاها',h:['پیام'],r:agg.errors.map(e=>[e])});
  return s;
}

function buildExport(scope){
  if(scope==='single'){
    if(!V.calcRes) return null;
    const m=S.models.find(x=>x.id===V.calcModelId);
    return {title:'محاسبه '+(m?m.name:'')+' — '+nowStr(),secs:sectionsSingle(V.calcRes),
      base:'calc-'+(m?m.name:'model')};
  }
  if(scope==='inv'){
    const pr=S.projects.find(p=>p.id===V.projectId);
    if(!pr) return null;
    return {title:'فاکتور پروژه '+pr.name+' — '+nowStr(),secs:sectionsInvoice(pr),
      base:'invoice-'+pr.name};
  }
  const pr=S.projects.find(p=>p.id===V.projectId);
  if(!pr) return null;
  return {title:'پروژه '+pr.name+' — '+nowStr(),secs:sectionsAggregate(aggregate(pr)),
    base:'project-'+pr.name};
}

    name=String(name||'').trim(); if(!name) return;

  insTok(tok){
    const el=V.fmlEl;
    if(!el || !document.contains(el)){ toast('اول داخل فیلد فرمول کلیک کن، بعد اسم رو بزن'); return; }
    const v=String(el.value||'');
    const s=(el.selectionStart==null?v.length:el.selectionStart);
    const e2=(el.selectionEnd==null?v.length:el.selectionEnd);
    let ins=tok;
    const before=v.slice(0,s), after=v.slice(e2);
    if(before && !/\s$/.test(before)) ins=' '+ins;
    if(after && !/^[\s+\-*/()^%<>=,.)]/.test(after)) ins=ins+' ';
    el.value=before+ins+after;
    el.dispatchEvent(new Event('input',{bubbles:true}));
    el.focus();
    try{ el.setSelectionRange(before.length+ins.length, before.length+ins.length); }catch(_){}
  },
  setIn(id,f,v){
    const m=S.models.find(x=>x.id===V.modelId); const i=m.inputs.find(x=>x.id===id); if(!i) return;
    i[f] = (f==='value') ? toMM(v,uFi(i)) : v; save();
    if(f==='mode') render();

  addHw(){
    const m=S.models.find(x=>x.id===V.modelId);
    m.hw.push({id:uid(),label:uniqLabel(m,'یراق'),formula:''}); save(); render();
  },
  setHw(id,f,v){ const m=S.models.find(x=>x.id===V.modelId); const x=m.hw.find(y=>y.id===id); if(x){ x[f]=v; save(); } },
  delHw(id){ const m=S.models.find(x=>x.id===V.modelId); m.hw=m.hw.filter(x=>x.id!==id); save(); render(); },

  /* محاسبه */
  pickCat(id){ V.pickCat=id; render(); },
  calcPick(id){ V.calcModelId=id; V.calcFree={}; V.calcRes=null; V.tab='calc'; render(); },
  calcModel(id){ V.calcModelId=id; V.calcFree={}; V.calcRes=null; V.tab='calc'; render(); },
  calcBack(){ V.calcModelId=null; V.calcRes=null; render(); },
  setFree(id,v){ V.calcFree[id]=v; },
  runCalc(){
    const m=S.models.find(x=>x.id===V.calcModelId); if(!m) return;
    const fv={}, byId={}; (m.inputs||[]).forEach(x=>byId[x.id]=x);
    Object.keys(V.calcFree||{}).forEach(k=>{ const s=String(V.calcFree[k]==null?'':V.calcFree[k]).trim(); if(s!=='') fv[k]=toMM(s,uFi(byId[k])); });

    if(el) el.scrollIntoView({behavior:'smooth',block:'center'});

  /* پروژه‌ها */
  addProject(name){
    name=String(name||'').trim(); if(!name) return;
    S.projects.push({id:uid(),name:name,items:[]}); save(); render();
  },
  openProject(id){ V.projectId=id; V.adding=false; V.editItem=null; V.expanded=null; V.showSummary=false; V.showInvoice=false; V.tab='project'; render(); },
  delProject(id){ if(!confirm('پروژه حذف بشه؟')) return; S.projects=S.projects.filter(p=>p.id!==id); save(); render(); },
  setPrjName(v){ const p=S.projects.find(x=>x.id===V.projectId); if(p){ p.name=v; save(); } },
  startAdd(){ V.adding=true; V.editItem=null; V.addCat=null; V.addModelId=null; V.addFree={}; V.addMore=false; V.addDirty=false; render(); },
  cancelAdd(){ V.adding=false; V.editItem=null; V.addMore=false; render(); },
  setAddCat(id){ V.addCat=id; V.addModelId=null; V.addFree={}; V.addDirty=false; render(); },
  setAddModel(id){ V.addModelId=id; V.addFree={}; V.addMore=false; V.addDirty=false; render(); focusAddInput(); },
  setAddFree(id,v){ V.addFree[id]=v; V.addDirty=true; },
  toggleAddMore(){ V.addMore=!V.addMore; render(); },
  commitAdd(stay){
    const pr=S.projects.find(p=>p.id===V.projectId); if(!pr) return;
    const m=S.models.find(x=>x.id===V.addModelId); if(!m){ toast('اول مدل رو انتخاب کن'); return; }
    const values={};
    (m.inputs||[]).filter(i=>i.mode==='free').forEach(i=>{
      values[i.id]=(V.addFree[i.id]!==undefined && String(V.addFree[i.id]).trim()!=='') ? String(toMM(V.addFree[i.id],uFi(i))) : String(i.value);
    });
    if(V.editItem){
      const it=pr.items.find(x=>x.id===V.editItem);
      if(it){ it.modelId=m.id; it.values=values; }
      toast('کابینت به‌روزرسانی شد');
      V.adding=false; V.editItem=null; V.addFree={}; V.addMore=false; V.addDirty=false;
      save(); render();
      return;
    }
    if(!stay && !V.addDirty){
      // چیزی تایپ نشده (مثلاً همین الان با اینتر اضافه کردی) — فقط ببند، ردیف تکراری نساز
      V.adding=false; V.addFree={}; V.addMore=false; V.addDirty=false;
      toast('کابینت جدیدی وارد نشده بود — پنل بسته شد');
      render();
      return;
    }
    pr.items.push({id:uid(),modelId:m.id,values:values});
    save();
    if(stay){
      // افزودن و بعدی: پنل باز می‌مونه، فقط مقدار اصلی به پیش‌فرض برمی‌گرده
      V.addFree={}; V.addMore=false; V.addDirty=false;
      toast('اضافه شد — طول بعدی رو وارد کن');
      render(); focusAddInput();
    }else{
      V.adding=false; V.addFree={}; V.addMore=false; V.addDirty=false;
      toast('به پروژه اضافه شد');
      render();
    }
  },
  editItemFn(id){
    const pr=S.projects.find(p=>p.id===V.projectId); const it=pr.items.find(x=>x.id===id);
    const m=S.models.find(x=>x.id===it.modelId); if(!m) return;
    V.adding=true; V.editItem=id; V.addCat=m.catId; V.addModelId=m.id;
    V.addFree={}; Object.assign(V.addFree,it.values||{});
    const byId={}; (m.inputs||[]).forEach(x=>byId[x.id]=x);
    Object.keys(V.addFree).forEach(k=>{ V.addFree[k]=toU(V.addFree[k],uFi(byId[k])); });
    render();
    const el=document.getElementById('addPanel'); if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
  },
  delItem(id){
    const pr=S.projects.find(p=>p.id===V.projectId);
    if(!confirm('این کابینت از پروژه حذف بشه؟')) return;
    pr.items=pr.items.filter(x=>x.id!==id);
    if(V.expanded===id) V.expanded=null;
    save(); render();

  toggleRow(id){ V.expanded = V.expanded===id?null:id; render(); },
  toggleSummary(){ V.showSummary=!V.showSummary; if(V.showSummary){ V.expanded=null; V.showInvoice=false; } render(); },
  toggleInvoice(){ V.showInvoice=!V.showInvoice; if(V.showInvoice){ V.showSummary=false; V.expanded=null; } render();
    if(V.showInvoice){ const el=document.getElementById('invCard'); if(el) el.scrollIntoView({block:'nearest'}); } },
  setInv(kind,key,fld,val){
    const pr=S.projects.find(p=>p.id===V.projectId); if(!pr) return;
    if(!pr.inv) pr.inv={mats:{},hw:{},groove:'',pvc:''};
    if(kind==='mats'){ if(!pr.inv.mats) pr.inv.mats={}; if(!pr.inv.mats[key]) pr.inv.mats[key]={sheet:'',area:''}; pr.inv.mats[key][fld]=val; }
    else if(kind==='hw'){ if(!pr.inv.hw) pr.inv.hw={}; pr.inv.hw[key]=val; }
    else if(kind==='groove') pr.inv.groove=val;
    else if(kind==='pvc') pr.inv.pvc=val;
    save(); render();
    const el=document.getElementById('invCard'); if(el) el.scrollIntoView({block:'nearest'});
  },

  /* تنظیمات */
  setSt(f,v){ S.settings[f]=(f==='sheetL'||f==='sheetW') ? (toMM(v)||S.settings[f]) : num(v); save(); },
  setUnit(u){
    const oldF=uF(); S.settings.unit=u; const newF=uF();
    const conv=(o)=>{ const r={}; Object.keys(o||{}).forEach(k=>{ const s=String(o[k]==null?'':o[k]).trim(); if(s===''||isNaN(parseFloat(s))) r[k]=o[k]; else r[k]=String(Math.round(parseFloat(s)*oldF/newF*100)/100); }); return r; };
    V.calcFree=conv(V.calcFree); V.addFree=conv(V.addFree);
    save(); render();
  },
  expJSON(){ download('kargah-backup-'+Date.now()+'.json',JSON.stringify(S,null,2),'application/json'); toast('فایل پشتیبان JSON ذخیره شد'); },
  expHTML(){
    const clone=document.documentElement.cloneNode(true);
    const root=clone.querySelector('#app'); if(root) root.innerHTML='';
    const pa=clone.querySelector('#printArea'); if(pa) pa.innerHTML='';
    const old=clone.querySelector('#embdata'); if(old && old.parentNode) old.parentNode.removeChild(old);
    const sc=document.createElement('script'); sc.type='application/json'; sc.id='embdata';
    sc.textContent=JSON.stringify(S).replace(/<\//g,'<\\/');
    const body=clone.querySelector('body')||clone;
    const ref=body.querySelector('script:not([type])')||body.querySelector('script');
    if(ref) body.insertBefore(sc, ref); else body.appendChild(sc);
    download('kargah-'+Date.now()+'.html','<!DOCTYPE html>\n'+clone.outerHTML,'text/html;charset=utf-8');
    toast('فایل HTML با داده‌ها ذخیره شد');
  },
  applyState(obj){
    if(!obj || !obj.settings || !obj.categories || !obj.models || !obj.projects){ toast('این فایل پشتیبان کارگاه نیست'); return false; }
    S=obj;
    V.projectId=null; V.adding=false; V.editItem=null; V.expanded=null;
    V.showSummary=false; V.showInvoice=false; V.tab='cats'; V.catId=null; V.modelId=null;
    save(); render(); toast('اطلاعات بازیابی شد');
    return true;
  },
  impJSON(file){
    if(!file) return;
    const fr=new FileReader();
    fr.onload=function(){
      let d=null;
      try{ d=JSON.parse(fr.result); }catch(e){ toast('JSON نامعتبر: '+e.message); return; }
      if(!d || !d.settings || !d.categories || !d.models || !d.projects){ toast('این فایل پشتیبان کارگاه نیست'); return; }
      if(!confirm('اطلاعات فعلی با این فایل جایگزین بشه؟')) return;
      App.applyState(d);
    };
    fr.readAsText(file);
  },
  loadDemo(){
    if(!confirm('داده‌های فعلی با مثال نمونه جایگزین بشه؟')) return;
    S=JSON.parse(JSON.stringify(DEMO)); save();
    V={tab:'cats',catId:null,modelId:null,openPiece:null,projectId:null,calcModelId:null,calcFree:{},calcRes:null,adding:false,addCat:null,addModelId:null,addFree:{},editItem:null,expanded:null,showSummary:false,editCat:null};
    render(); toast('مثال نمونه بارگذاری شد');
  },
  wipe(){ if(!confirm('همه دسته‌ها، مدل‌ها و پروژه‌ها پاک بشن؟')) return; localStorage.removeItem(LS_KEY); S=JSON.parse(JSON.stringify(DEF)); V={tab:'cats',catId:null,modelId:null,openPiece:null,projectId:null,calcModelId:null,calcFree:{},calcRes:null,adding:false,addCat:null,addModelId:null,addFree:{},editItem:null,expanded:null,showSummary:false,editCat:null}; render(); },

  /* خروجی‌ها */
  print(scope){ const e=buildExport(scope); if(!e){ toast('چیزی برای چاپ نیست'); return; } doPrint(e.title,e.secs); },
  expCSV(scope){ const e=buildExport(scope); if(!e){ toast('چیزی نیست'); return; } download(e.base+'.csv',toCSV(flatten(e.title,e.secs)),'text/csv;charset=utf-8'); toast('فایل CSV ذخیره شد'); },
  expXLS(scope){ const e=buildExport(scope); if(!e){ toast('چیزی نیست'); return; } download(e.base+'.xls',toXLS(e.title,e.secs),'application/vnd.ms-excel'); toast('فایل Excel ذخیره شد'); }
};

});

if(_em){

    if(_d && _d.settings && _d.categories){
      const _had=!!localStorage.getItem(LS_KEY);
      if(!_had){ S=_d; save(); }
      else if(JSON.stringify(_d)!==JSON.stringify(S) && confirm('این فایل HTML داده داره. جایگزین اطلاعات فعلی این مرورگر بشه؟')){
        S=_d; save();
      }
    }
  }catch(e){ if(window.console) console.warn('embdata',e); }
}
render();
if(!localStorage.getItem(LS_KEY)){
  save();
  setTimeout(()=>toast('یک مدل مثال از قبل پر شده — ببین هر بخش چطوری پر می‌شه'),400);
}
</script>

<script>
/* ماژول آنالیز: ثبت service worker (فقط http/https) — سوییس قدیمی همین ماژول رو جایگزین و پاک می‌کنه */
if ('serviceWorker' in navigator && (location.protocol==='http:'||location.protocol==='https:')) {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('./sw.js').catch(function(){}); });
}
</script>
